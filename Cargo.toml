[workspace]
resolver = "2"
members = [
    "crates/php-types",
    "crates/php-runtime",
    "crates/php-builtins",
    "crates/php-cli",
    "crates/phpt-runner",
    "crates/php-server",
    "crates/wprust-server",
    "crates/wprust-prototype",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PHP-3.01"
authors = ["Matin Sanei", "Francesco Tinti", "php-rust contributors"]

[workspace.dependencies]
php-types = { path = "crates/php-types" }
php-runtime = { path = "crates/php-runtime" }
php-builtins = { path = "crates/php-builtins" }
log = "0.4"
log4rs = "1.3"
mimalloc = "0.1"
rustc-hash = "2"
static_assertions = "1.1"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev-release]
inherits = "release"
incremental = true
lto = false
codegen-units = 16
